# Construye el ejecutable de escritorio (webcam) en los runners de GitHub.
# Los archivos quedan como artefactos descargables de cada ejecución.
name: App de escritorio

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'src/core/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/escritorio.yml'
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
            artefactos: |
              release/*.exe
          - os: ubuntu-latest
            nombre: linux
            artefactos: |
              release/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobaciones
        run: |
          npm test
          npm run typecheck

      - name: Empaquetar
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: posturefix-${{ matrix.nombre }}
          path: ${{ matrix.artefactos }}
          if-no-files-found: error

  publicar:
    # Al etiquetar una versión (v1.0.1, v1.1.0…) los ejecutables se cuelgan de
    # un Release, que a diferencia de los artefactos no caduca ni pide sesión.
    name: Publicar la versión
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Sacar las notas del CHANGELOG
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.ETIQUETA.replace(/^v/, '');
            const seccion = fs.readFileSync('CHANGELOG.md', 'utf8')
              .split(/^## /m)
              .find((bloque) => bloque.trimStart().startsWith(version));
            fs.writeFileSync('notas.md', seccion ? '## ' + seccion.trim() : 'Sin notas para ' + version + '.');
          "
          cat notas.md

      - name: Crear el Release con los ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "PostureFix ${{ github.ref_name }}" \
            --notes-file notas.md \
            artefactos/posturefix-windows/*.exe \
            artefactos/posturefix-linux/*.AppImage
