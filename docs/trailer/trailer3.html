<body>
<div id="wrap"><div id="shake">

  <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
</div></div>
<script src="trailer3-3d.js"></script>
<script>
/*
 * Tráiler 3: más largo y con escenas en 3D (three.js) mezcladas con las de 2D.
 * Igual que los otros, es una función del tiempo, `setT(t)`: el lienzo `#gl`
 * lleva lo 3D, los SVG (debajo y encima) llevan el fondo y los textos.
 */
const W = 1920, H = 1080, DURATION = 77;
const C = {
  bg: '#0A0706', orange: '#FF7A29', orange2: '#FF8A45', red: '#FF453A',
  green: '#30D158', yellow: '#FFD60A', ink: '#FFFFFF',
  dim: 'rgba(246,236,230,0.66)', dimmer: 'rgba(246,236,230,0.38)', line: '#5B4A44',
};
const QR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h35v35H0z"/><path stroke="#0a0706" d="M1 1.5h7m1 0h2m1 0h2m3 0h1m2 0h3m1 0h1m2 0h7M1 2.5h1m5 0h1m1 0h2m1 0h2m1 0h1m1 0h2m5 0h2m1 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m2 0h3m1 0h4m1 0h1m1 0h1m3 0h1m1 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h1m9 0h1m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m2 0h2m1 0h2m2 0h3m3 0h3m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m2 0h3m2 0h3m1 0h1m2 0h3m2 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h5m2 0h5m4 0h1M1 9.5h1m1 0h2m1 0h3m1 0h1m4 0h5m2 0h4m1 0h1m2 0h1m1 0h2M3 10.5h3m3 0h7m1 0h2m1 0h2m2 0h1m2 0h2m1 0h3M1 11.5h3m1 0h1m1 0h2m2 0h2m1 0h1m2 0h1m1 0h1m2 0h3m2 0h4m1 0h2M1 12.5h3m1 0h1m2 0h2m3 0h1m2 0h3m1 0h1m1 0h2m2 0h3m1 0h1m2 0h1M2 13.5h1m1 0h2m1 0h3m1 0h1m1 0h1m1 0h3m3 0h6m2 0h2m1 0h2M1 14.5h6m3 0h1m2 0h3m2 0h1m2 0h2m1 0h1m3 0h1m1 0h1m1 0h1M3 15.5h2m1 0h4m2 0h1m2 0h1m2 0h1m1 0h3m4 0h3M5 16.5h2m4 0h1m1 0h1m1 0h2m5 0h1m2 0h3m2 0h2M5 17.5h3m3 0h5m5 0h3m2 0h2m1 0h3M1 18.5h1m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h2m4 0h1m1 0h5m1 0h2m1 0h2M5 19.5h1m1 0h1m3 0h2m1 0h1m1 0h2m1 0h1m1 0h2m2 0h2m1 0h2m1 0h1M1 20.5h1m1 0h1m5 0h3m2 0h1m3 0h3m2 0h5m1 0h1m2 0h1M3 21.5h1m1 0h1m1 0h4m3 0h2m1 0h1m5 0h1m1 0h1m2 0h1m1 0h3M1 22.5h1m8 0h1m2 0h6m2 0h4m5 0h1m2 0h1M3 23.5h6m1 0h2m1 0h2m1 0h1m1 0h5m1 0h4m3 0h3M2 24.5h1m3 0h1m2 0h1m1 0h3m2 0h1m2 0h1m1 0h1m5 0h4m2 0h1M1 25.5h1m2 0h1m1 0h3m2 0h1m1 0h1m1 0h1m2 0h1m1 0h1m2 0h8m2 0h1M9 26.5h1m1 0h2m1 0h1m1 0h2m2 0h3m2 0h1m3 0h2m1 0h1M1 27.5h7m1 0h3m2 0h2m1 0h6m1 0h2m1 0h1m1 0h1M1 28.5h1m5 0h1m1 0h1m1 0h2m2 0h5m1 0h1m2 0h2m3 0h3M1 29.5h1m1 0h3m1 0h1m2 0h4m1 0h6m2 0h7m1 0h1m1 0h1M1 30.5h1m1 0h3m1 0h1m1 0h1m7 0h1m2 0h1m1 0h3m3 0h1m3 0h2M1 31.5h1m1 0h3m1 0h1m1 0h1m2 0h1m3 0h4m1 0h1m1 0h1m3 0h2m1 0h1M1 32.5h1m5 0h1m3 0h3m1 0h1m2 0h1m2 0h1m1 0h7m3 0h1M1 33.5h7m1 0h2m1 0h1m4 0h4m1 0h1m1 0h1m1 0h2m1 0h3"/></svg>`;

// ----------------------------------------------------------------- utilidades
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
/** Muelle con un pequeño rebote, de 0 a 1. */
const spring = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x));
const noise = (x) => { const s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); };
const smoothNoise = (x) => { const i = Math.floor(x), f = x - i; return lerp(noise(i), noise(i + 1), f * f * (3 - 2 * f)); };

const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join('');
};

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, str, x, y, size, cls, fill, anchor = 'start') {
  const e = el('text', { x, y, 'font-size': size, class: cls, fill, 'text-anchor': anchor }, parent);
  e.textContent = str;
  return e;
}
const op = (e, v) => e.setAttribute('opacity', clamp(v).toFixed(3));
const place = (e, x = 0, y = 0, s = 1, r = 0, ox = 0, oy = 0) =>
  e.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)}) translate(${-ox} ${-oy})`);
/** Escala y gira alrededor de un punto. */
const around = (e, cx, cy, s = 1, r = 0) => place(e, cx, cy, s, r, cx, cy);
/** Aparece subiendo: devuelve el avance 0-1 y aplica opacidad y desplazamiento. */
function reveal(e, t, a, dur = 0.55, dy = 28) {
  const p = easeOut(seg(t, a, a + dur));
  op(e, p);
  e.setAttribute('transform', `translate(0 ${((1 - p) * dy).toFixed(2)})`);
  return p;
}
const sceneAlpha = (t, a, b, f = 0.35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));


// ------------------------------------------------------------------- escenario
const bgSvg = document.getElementById('bg');
const bdefs = el('defs', {}, bgSvg);
for (const [id, color, a] of [['glowO', C.orange, 0.55], ['glowR', C.red, 0.6]]) {
  const g = el('radialGradient', { id, cx: '50%', cy: '50%', r: '50%' }, bdefs);
  el('stop', { offset: '0%', 'stop-color': color, 'stop-opacity': a }, g);
  el('stop', { offset: '100%', 'stop-color': color, 'stop-opacity': 0 }, g);
}
const glow1 = el('ellipse', { cx: 360, cy: 980, rx: 900, ry: 560, fill: 'url(#glowO)' }, bgSvg);
const glow2 = el('ellipse', { cx: 1640, cy: 80, rx: 760, ry: 460, fill: 'url(#glowR)' }, bgSvg);
const svg = document.getElementById('svg');
const defs = el('defs', {}, svg);
const vig = el('radialGradient', { id: 'vig', cx: '50%', cy: '50%', r: '75%' }, defs);
el('stop', { offset: '55%', 'stop-color': '#000', 'stop-opacity': '0' }, vig);
el('stop', { offset: '100%', 'stop-color': '#000', 'stop-opacity': '0.65' }, vig);
// El S7 (cierre) reutiliza los resplandores del tráiler 1 en su propio halo.
for (const [id, color, a] of [['glowO', C.orange, 0.55]]) {
  const g = el('radialGradient', { id: id + '2', cx: '50%', cy: '50%', r: '50%' }, defs);
  el('stop', { offset: '0%', 'stop-color': color, 'stop-opacity': a }, g);
  el('stop', { offset: '100%', 'stop-color': color, 'stop-opacity': 0 }, g);
}
const shake = document.getElementById('shake');
const stage = el('g', {}, svg);
const scenes = {};
for (const id of ['a', 'b', 'c', 'd', 's4', 's5', 's6', 'f', 't', 's7']) scenes[id] = el('g', {}, stage);
const flash = el('rect', { width: W, height: H, fill: '#fff', opacity: 0 }, svg);
el('rect', { width: W, height: H, fill: 'url(#vig)', 'pointer-events': 'none' }, svg);
const fade = el('rect', { width: W, height: H, fill: '#000', opacity: 0 }, svg);

// ------------------------------------------------------------------ escena 4
const S4 = {};
{
  const g = scenes.s4;
  S4.bgRed = el('rect', { width: W, height: H, fill: C.red, opacity: 0 }, g);
  S4.bgGreen = el('rect', { width: W, height: H, fill: C.green, opacity: 0 }, g);
  S4.steps = ['1 · PITIDO', '2 · CUENTA', '3 · ALARMA', '4 · RECUPERA'].map((s, i) => {
    const row = el('g', {}, g);
    const bg = el('rect', { x: 330 + i * 316, y: 80, width: 296, height: 62, rx: 31, fill: 'rgba(255,255,255,0.08)' }, row);
    const tx = text(row, s, 330 + i * 316 + 148, 122, 30, 'sansb', C.dimmer, 'middle');
    return { row, bg, tx };
  });
  S4.intro = text(g, 'LA ALERTA SUBE DE TONO', 960, 570, 150, 'disp', C.ink, 'middle');
  S4.beepRings = [0, 1, 2, 3].map(() => el('circle', { cx: 960, cy: 560, r: 10, fill: 'none', stroke: C.yellow, 'stroke-width': 8, opacity: 0 }, g));
  S4.beep = text(g, 'PITIDO', 960, 640, 250, 'disp', C.yellow, 'middle');
  S4.beepSub = text(g, 'A los 4 segundos encorvado', 960, 780, 46, 'sans', C.dim, 'middle');
  S4.count = text(g, 'UNO', 960, 720, 420, 'disp', C.ink, 'middle');
  S4.countSub = text(g, 'la voz cuenta', 960, 830, 46, 'sans', C.dim, 'middle');
  S4.alarm1 = text(g, '¡ENDEREZA LA', 960, 510, 200, 'disp', '#fff', 'middle');
  S4.alarm2 = text(g, 'ESPALDA!', 960, 790, 290, 'disp', '#fff', 'middle');
  S4.eas = text(g, 'Tono EAS · 853 + 960 Hz', 960, 940, 44, 'sansb', '#fff', 'middle');
  S4.ok = text(g, 'BIEN.', 960, 600, 380, 'disp', '#fff', 'middle');
  S4.ok2 = text(g, 'Espalda recta.', 960, 740, 90, 'sansb', '#fff', 'middle');
  S4.check = el('path', { d: 'M-90 0 L-30 62 L96 -74', stroke: '#fff', 'stroke-width': 28, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
}
function updateS4(t) {
  op(scenes.s4, sceneAlpha(t, 21, 30.5, 0.2));
  // Qué paso está activo.
  const phase = t < 24 ? 0 : t < 26.8 ? 1 : t < 29.6 ? 2 : 3;
  S4.steps.forEach((s, i) => {
    const on = t >= 21.4 && i === phase && t < 30.5, done = t >= 21.4 && i < phase;
    s.bg.setAttribute('fill', on ? (i === 2 ? C.red : i === 3 ? C.green : C.orange) : done ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.07)');
    s.tx.setAttribute('fill', on ? (i === 1 ? '#1F0C02' : '#fff') : done ? C.dim : C.dimmer);
    reveal(s.row, t, 21.2 + i * 0.08, 0.4, -20);
  });
  // Introducción.
  const iv = seg(t, 21.0, 21.25) * (1 - seg(t, 21.35, 21.6));
  op(S4.intro, iv); around(S4.intro, 960, 520, lerp(1.0, 1.06, seg(t, 21, 21.6)));
  // Pitido: cuatro pulsos.
  const beepOn = t >= 21.5 && t < 24.0;
  op(S4.beep, beepOn ? seg(t, 21.5, 21.6) * (1 - seg(t, 23.7, 24.0)) : 0);
  const sc = beepOn ? 1 + 0.1 * Math.max(0, 1 - ((t - 21.5) % 0.3) / 0.15) : 1;
  around(S4.beep, 960, 560, sc);
  op(S4.beepSub, beepOn ? seg(t, 21.9, 22.3) * (1 - seg(t, 23.7, 24.0)) : 0);
  S4.beepRings.forEach((r, i) => {
    const k = (t - (21.5 + i * 0.3)) / 0.9;
    if (k < 0 || k > 1) { op(r, 0); return; }
    r.setAttribute('r', (60 + easeOut(k) * 640).toFixed(1)); op(r, 0.85 * (1 - k));
    r.setAttribute('stroke', i % 2 ? C.orange : C.yellow);
  });
  // Cuenta.
  const words = ['UNO', 'DOS', 'TRES'], cols = [C.yellow, C.orange, C.red];
  const ci = clamp(Math.floor((t - 24.0) / 0.9), 0, 2);
  const counting = t >= 24.0 && t < 26.8;
  const within = (t - 24.0) - ci * 0.9;
  S4.count.textContent = words[ci]; S4.count.setAttribute('fill', cols[ci]);
  op(S4.count, counting ? (t < 26.7 ? 1 : 1 - seg(t, 26.7, 26.8)) : 0);
  around(S4.count, 960, 560, counting ? lerp(0.6, 1, spring(clamp(within / 0.5))) : 1);
  op(S4.countSub, counting ? seg(t, 24.2, 24.6) : 0);
  // Alarma.
  const alarm = t >= 26.8 && t < 29.6;
  const blink = 0.5 + 0.5 * Math.sin((t - 26.8) * 2 * Math.PI * 2.5);
  op(S4.bgRed, alarm ? 0.35 + 0.45 * blink : 0);
  const pulse = 1 + 0.035 * Math.sin((t - 26.8) * 2 * Math.PI * 2.5);
  op(S4.alarm1, alarm ? 1 : 0); op(S4.alarm2, alarm ? 1 : 0); op(S4.eas, alarm ? seg(t, 27.2, 27.6) : 0);
  around(S4.alarm1, 960, 450, pulse); around(S4.alarm2, 960, 690, pulse);
  // Recuperado.
  const okOn = t >= 29.6;
  op(S4.bgGreen, okOn ? 0.5 * (1 - seg(t, 29.6, 30.5) * 0.4) : 0);
  const okp = spring(seg(t, 29.6, 30.1));
  op(S4.ok, okOn ? 1 : 0); op(S4.ok2, okOn ? seg(t, 29.8, 30.1) : 0);
  around(S4.ok, 960, 560, lerp(0.8, 1, okp));
  op(S4.check, 0);
}

// ------------------------------------------------------------------ escena 5
const S5 = {};
{
  const g = scenes.s5;
  S5.head = text(g, 'DOS FORMAS DE MEDIR', 960, 190, 124, 'disp', C.ink, 'middle');
  const card = (x, w) => el('rect', { x, y: 270, width: w, height: 600, rx: 36, fill: 'rgba(255,255,255,0.05)', stroke: 'rgba(255,240,230,0.14)', 'stroke-width': 2 }, g);
  S5.cardL = card(140, 760); S5.cardR = card(1020, 760);
  // Izquierda: torso con móvil en el bolsillo.
  S5.L = el('g', {}, g);
  S5.torso = el('path', { fill: 'none', 'stroke-linecap': 'round', 'stroke-width': 110 }, S5.L);
  S5.headL = el('circle', { r: 56 }, S5.L);
  S5.pocket = el('g', {}, S5.L);
  el('rect', { x: -44, y: -62, width: 88, height: 150, rx: 16, fill: '#1b1412', stroke: C.orange, 'stroke-width': 5 }, S5.pocket);
  el('rect', { x: -32, y: -46, width: 64, height: 100, rx: 6, fill: '#0e0908' }, S5.pocket);
  S5.waves = [0, 1, 2].map((i) => el('path', { d: 'M62 -30 q26 30 0 60', stroke: C.orange, 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, S5.pocket));
  S5.lt1 = text(g, 'EN EL MÓVIL', 520, 800, 74, 'disp', C.ink, 'middle');
  S5.lt2 = text(g, 'acelerómetro + giroscopio', 520, 848, 34, 'sans', C.dim, 'middle');
  // Derecha: portátil con webcam.
  S5.R = el('g', {}, g);
  el('rect', { x: 1110, y: 330, width: 580, height: 360, rx: 22, fill: '#120c0a', stroke: C.line, 'stroke-width': 8 }, S5.R);
  el('path', { d: 'M1060 716 H1740 L1712 750 H1088 Z', fill: C.line }, S5.R);
  el('circle', { cx: 1400, cy: 345, r: 4, fill: C.green }, S5.R);
  S5.bust = el('g', {}, S5.R);
  S5.bustBody = el('path', { fill: '#3b2f2a' }, S5.bust);
  S5.bustHead = el('ellipse', { rx: 54, ry: 66, fill: '#7a6258' }, S5.bust);
  S5.tri = el('path', { fill: 'rgba(48,209,88,0.12)', 'stroke-width': 5, 'stroke-linejoin': 'round' }, S5.R);
  S5.pts = [0, 1, 2, 3].map(() => el('circle', { r: 11 }, S5.R));
  S5.rt1 = text(g, 'EN EL PORTÁTIL', 1400, 800, 74, 'disp', C.ink, 'middle');
  S5.rt2 = text(g, 'webcam · MediaPipe Pose', 1400, 848, 34, 'sans', C.dim, 'middle');
  S5.priv = text(g, 'El vídeo no sale de tu equipo.', 960, 975, 46, 'sansb', C.ink, 'middle');
}
function updateS5(t) {
  op(scenes.s5, sceneAlpha(t, 30.5, 36.5, 0.3));
  reveal(S5.head, t, 30.8, 0.6, 30);
  op(S5.cardL, seg(t, 31.2, 31.7)); op(S5.cardR, seg(t, 31.5, 32.0));
  const slouch = 0.5 - 0.5 * Math.cos(clamp((t - 32.2) / 2.4) * Math.PI * 2 * 0.5 + (t > 34.6 ? 0 : 0));
  const s = clamp(easeInOut(seg(t, 32.2, 33.8)) * (1 - easeInOut(seg(t, 34.6, 35.6))));
  const col = mix(C.green, C.red, s * 1.2);
  // Torso del móvil.
  const base = { x: 520, y: 740 };
  const lean = s * 0.5;
  const top = { x: base.x + 230 * Math.sin(lean), y: base.y - 300 * Math.cos(lean) + 0 };
  S5.torso.setAttribute('d', `M${base.x} ${base.y} Q${base.x - 20 * s} ${(base.y + top.y) / 2} ${top.x} ${top.y}`);
  S5.torso.setAttribute('stroke', mix('#3b2f2a', '#5a3a30', s));
  S5.headL.setAttribute('cx', top.x + 40 * s); S5.headL.setAttribute('cy', top.y - 86 + 22 * s); S5.headL.setAttribute('fill', '#7a6258');
  place(S5.pocket, lerp(base.x + 70, top.x + 70, 0.52), lerp(base.y - 60, top.y + 40, 0.5), 1, s * 28);
  S5.waves.forEach((w, i) => { const k = ((t * 1.6 - i * 0.25) % 1 + 1) % 1; w.setAttribute('transform', `translate(${i * 14} 0)`); op(w, (1 - k) * 0.9 * seg(t, 31.8, 32.3)); });
  op(S5.L, seg(t, 31.3, 31.9)); op(S5.R, seg(t, 31.6, 32.2));
  reveal(S5.lt1, t, 32.0); reveal(S5.lt2, t, 32.3); reveal(S5.rt1, t, 32.2); reveal(S5.rt2, t, 32.5); reveal(S5.priv, t, 34.2);
  // Busto en la webcam: baja y se acerca al encorvarse.
  const cx = 1400, cy = 520 + 40 * s, k = 1 + 0.18 * s;
  S5.bustHead.setAttribute('cx', cx); S5.bustHead.setAttribute('cy', cy - 60 * k + 26 * s);
  S5.bustBody.setAttribute('d', `M${cx - 180 * k} ${700} Q${cx - 170 * k} ${cy + 20} ${cx} ${cy + 10} Q${cx + 170 * k} ${cy + 20} ${cx + 180 * k} ${700} Z`);

    const on = idx === i && !soon;
    op(ic, on ? seg(t, TE.items[i].t0 + 0.3, TE.items[i].t0 + 0.6) * (1 - seg(t, TE.items[i].t1 - 0.15, TE.items[i].t1)) : 0);
    ic.setAttribute('transform', 'translate(-450 380) scale(0.8)');
  });
  if (TE.led) TE.led.setAttribute('opacity', (Math.floor(t * 4) % 2 ? 1 : 0.25).toFixed(2));
  // «PRONTO.» con un tembleque de glitch.
  const sp = seg(t, 70.5, 71.0);
  op(TE.soon, soon ? 1 : 0);
  TE.soon.setAttribute('x', 960 + (soon && sp < 0.5 ? Math.sin(t * 160) * 14 * (1 - sp * 2) : 0));
  TE.soon.setAttribute('fill', soon && sp < 0.35 ? C.orange : C.ink);
  op(TE.head, soon ? 0 : TE.head.getAttribute('opacity'));
}

// -------------------------------------------------------------------- tiempo
function setT(t) {
  t = clamp(t, 0, DURATION);
  T3.render(t);
  updateA(t); updateB(t); updateC(t); updateD(t);
  updateS4(t - 2); updateS5(t - 17.5); updateS6(t - 17.5);
  updateF(t); updateT(t); updateS7(t - 29);
  const alarm = t >= 28.8 && t < 31.6;
  op(glow1, 0.55 - 0.25 * seg(t, 23, 26) + 0.2 * seg(t, 32.5, 33));
  op(glow2, 0.3 + 0.5 * seg(t, 18.8, 23) * (1 - seg(t, 23, 23.2)) + (alarm ? 0.5 : 0));
  let f = 0, sx = 0, sy = 0;
  const hit = (t0, power, dur = 0.4) => {
    const k = (t - t0) / dur;
    if (k < 0 || k > 1) return;
    f = Math.max(f, power * (1 - k) * (1 - k));
    const a = power * 26 * (1 - k) * (1 - k);
    sx += Math.sin(t * 90) * a; sy += Math.cos(t * 77) * a;
  };
  hit(7.0, 0.9, 0.6); hit(23.5, 0.25, 0.2); hit(28.8, 0.5, 0.4); hit(31.6, 0.45, 0.5); hit(70.5, 0.35, 0.4); hit(71.0, 0.5, 0.5);
  op(flash, f); shake.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`;
  op(fade, Math.max(1 - seg(t, 0, 0.8), seg(t, 76.1, 77)));
}
window.setT = setT;
window.DURATION = DURATION;

window.ready = Promise.all([
  document.fonts.load('800 40px Inter'), document.fonts.load('600 40px Inter'), document.fonts.load('900 40px "Big Shoulders Display"'),
]);
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  document.getElementById('wrap').style.transform = `translate(-50%, -50%) scale(${k})`;
}
addEventListener('resize', fit); fit();
window.ready.then(() => setT(0));
if (!location.search.includes('manual')) {
  const hint = document.createElement('div');
  hint.textContent = 'Pulsa para ver el tráiler';
  hint.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 28px Inter,sans-serif;background:rgba(0,0,0,.6);cursor:pointer';
  document.body.appendChild(hint);
  hint.addEventListener('click', () => {
    hint.remove();
    const t0 = performance.now();
    (function loop() { const t = (performance.now() - t0) / 1000; setT(t); if (t < DURATION) requestAnimationFrame(loop); })();
  });
}
</script>
